<script>
(function () {
  function rng(seed) { var s = (seed >>> 0) || 1; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function jumpAt(root) {
    var el = root.querySelector('.vx-pf-jump'), v = parseFloat(el ? el.textContent.replace(',', '.') : '');
    return (isFinite(v) && v > 0 ? v : 4) * 1000;
  }
  function escalate(root, svg) {
    var bill = svg.querySelector('[data-bill]'), bag = svg.querySelector('[data-bag]'), body = svg.querySelector('[data-body]');
    var back = svg.querySelector('[data-arm-back]'), front = svg.querySelector('[data-arm-front]'), fires = [].slice.call(svg.querySelectorAll('[data-fire]'));
    if (!bill || !bag || !body || !back || !front) return;
    [bag, back].forEach(function (el) { el.style.transformBox = 'fill-box'; });
    bag.style.transformOrigin = 'center'; back.style.transformOrigin = '100% 0%';
    fires.forEach(function (f) { f.style.transformBox = 'fill-box'; f.style.transformOrigin = '50% 100%'; });
    var t0 = performance.now(), JUMP = jumpAt(root), BAG = 1950, count = 0, done = false;
    function grow(from, to, pulse, dur, delay) {
      fires.forEach(function (f, i) {
        f.animate([
          { transform: 'scale(' + from + ',' + from + ')' },
          { transform: 'scale(' + (pulse + i * .04) + ',' + (pulse * 1.1 + i * .06) + ')', offset: .3 },
          { transform: 'scale(' + to + ',' + to + ')' }
        ], { duration: dur, delay: delay || 0, easing: 'ease-out', fill: 'forwards' });
      });
    }
    function jump(s) {
      bag.style.display = 'none';
      // origin fixed at his feet in viewBox units; he lands in the middle of the fire (x 292) and shrinks away behind the flames
      body.style.transformBox = 'view-box'; body.style.transformOrigin = '92px 232px';
      body.animate([
        { transform: 'translate(0,0) scale(1,1)', opacity: 1 },
        { transform: 'translate(-4px,4px) scale(1.04,.9)', opacity: 1, offset: .15 },
        { transform: 'translate(100px,-95px) rotate(6deg) scale(.95,.95)', opacity: 1, offset: .5 },
        { transform: 'translate(196px,-20px) rotate(2deg) scale(.8,.8)', opacity: 1, offset: .78 },
        { transform: 'translate(200px,-6px) rotate(0deg) scale(.45,.45)', opacity: 0 }
      ], { duration: 1100, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
      grow(s, s + .35, s + .8, 1400, 850);
    }
    bill.querySelector('animateMotion').addEventListener('repeatEvent', function () {
      if (done) return;
      count++;
      var s = 1 + count * .07;
      grow(s - .07, s, s + .18, 600);
      if (performance.now() - t0 < JUMP - BAG) return;
      done = true; bill.dataset.done = '1'; bill.style.visibility = 'hidden';
      // both arms swing up together, the bag rides in the hands, then flies into the fire
      front.style.animation = 'none'; body.style.animation = 'none';
      front.animate([{ transform: 'rotate(30deg)' }, { transform: 'rotate(-124deg)' }], { duration: 520, delay: 300, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' });
      back.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-139deg)' }], { duration: 520, delay: 300, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' });
      var a = bag.animate([
        { opacity: 1, transform: 'translate(0,0) rotate(0deg)', offset: 0 },
        { opacity: 1, transform: 'translate(44px,-75px) rotate(-10deg)', offset: .32 },
        { opacity: 1, transform: 'translate(130px,-135px) rotate(110deg)', offset: .64 },
        { opacity: 1, transform: 'translate(206px,10px) rotate(230deg)', offset: .95 },
        { opacity: 0, transform: 'translate(210px,16px) rotate(240deg)', offset: 1 }
      ], { duration: 1650, delay: 300, easing: 'cubic-bezier(.35,.3,.6,1)', fill: 'forwards' });
      a.onfinish = function () {
        grow(s, s + .2, s + .5, 700);
        setTimeout(function () { jump(s + .2); }, Math.max(0, JUMP - (performance.now() - t0)));
      };
    });
  }
  function ambient(root, svg) {
    svg.querySelectorAll('[data-anim]').forEach(function (el) {
      el.style.transformBox = 'fill-box'; el.style.transformOrigin = el.dataset.origin || 'center'; el.style.animation = el.dataset.anim;
    });

    escalate(root, svg);
  }
  function reveal(root, svg, groups) {
    var r = rng(99), t = 0, end = 0, ease = 'cubic-bezier(.45,0,.2,1)';
    groups.forEach(function (g) {
      var start = t, gEnd = 520;
      setTimeout(function () {
        var a = g.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 520, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards' });
        a.onfinish = function () { g.style.opacity = ''; g.style.transform = ''; a.cancel(); };
      }, start);
      g.querySelectorAll('path,circle,rect,ellipse,text').forEach(function (p) {
        var L = parseFloat(p.dataset.len || 0), dur = 380;
        if (L) {
          dur = Math.min(1100, Math.max(380, L * 2.2));
          setTimeout(function () {
            var a = p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: dur, easing: ease, fill: 'forwards' });
            a.onfinish = function () { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; a.cancel(); };
          }, start);
        }
        if (p.style.fillOpacity === '0') {
          setTimeout(function () {
            var a = p.animate([{ fillOpacity: 0 }, { fillOpacity: 1 }], { duration: 320, easing: 'ease-out', fill: 'forwards' });
            a.onfinish = function () { p.style.fillOpacity = ''; a.cancel(); };
          }, start + dur * 0.6);
        }
        gEnd = Math.max(gEnd, dur, dur * 0.6 + 320);
      });
      end = Math.max(end, start + gEnd);
      t += 50 + r() * 80;
    });
    setTimeout(function () { ambient(root, svg); }, end);
  }
  function init(root) {
    var svg = root.querySelector('svg.vx-pf-svg');
    if (!svg) return;
    root.setAttribute('data-vx-ready', '1');
    var bill = svg.querySelector('[data-bill]');
    if (bill) {
      bill.style.visibility = 'hidden';
      bill.querySelector('animateMotion').addEventListener('beginEvent', function () { if (!bill.dataset.done) bill.style.visibility = ''; }, { once: true });
    }
    if (svg.pauseAnimations) svg.pauseAnimations();
    var groups = [].slice.call(svg.children).filter(function (c) { return c.tagName === 'g'; });
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { ambient(root, svg); return; }
    groups.forEach(function (g) {
      g.style.opacity = '0'; g.style.transform = 'translateY(14px)';
      g.querySelectorAll('path,circle,rect,ellipse').forEach(function (p) {
        var cs = getComputedStyle(p);
        if (cs.stroke !== 'none' && parseFloat(cs.strokeWidth) > 0) { var L = p.getTotalLength(); p.dataset.len = L; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; }
        if (cs.fill !== 'none') p.style.fillOpacity = '0';
      });
      g.querySelectorAll('text').forEach(function (x) { x.style.fillOpacity = '0'; });
    });
    var io = new IntersectionObserver(function (es) {
      if (es.some(function (e) { return e.isIntersecting; })) { io.disconnect(); reveal(root, svg, groups); }
    }, { threshold: 0.35 });
    io.observe(svg);
  }
  function run() { document.querySelectorAll('.vx-pf:not([data-vx-ready])').forEach(init); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
